[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itdesk-core"
version = "0.1.0"
description = "Библиотека ITDesk: API-клиент, справочники, форматирование"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools]
packages = ["itdesk_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
