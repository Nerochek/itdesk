# Конфигурация ITDesk. Лежит рядом с программой (или с .exe).
# Если меняешь port на сервере, поменяй его и в server_url клиента.

[server]
host = 127.0.0.1
port = 8000
# Только путь к старой SQLite для однократного переноса; рабочая база — MongoDB.
db_path = itdesk.db

[mongodb]
uri = mongodb://127.0.0.1:27017
database = itdesk

[client]
server_url = http://127.0.0.1:8000
